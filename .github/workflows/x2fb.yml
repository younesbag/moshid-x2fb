name: x2fb

# تشغيل مستمر: مهمة واحدة تعمل ~٥ ساعات و٤٠ دقيقة تستمع لتلغرام لحظياً (انتظار طويل)،
# تجلب من X كل ساعة، وتدفع السجل عند كل تغيير؛ ثم تطلق المهمة التالية بنفسها.
# جدول cron احتياط فقط: يعيد تشغيل السلسلة إن انقطعت (جدول GitHub غير دقيق — يتأخر ساعات).
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # دفع السجل
  actions: write    # إطلاق المهمة التالية

# مهمة واحدة في كل لحظة: تلغرام يرفض مستمعَين معاً، وطابع الادّعاء يفترض ألا تتسابق دورتان
concurrency:
  group: x2fb
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      # رأس الفرع لحظة التنفيذ، لا الـSHA المثبّت لحظة الإطلاق — وإلا قرأت المهمة المنتظرة سجلاً قديماً
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run loop
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSFORMER: ${{ vars.TRANSFORMER }}
          MODE: ${{ vars.MODE }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          VETO_HOURS: ${{ vars.VETO_HOURS }}
          X_USERNAME: ${{ vars.X_USERNAME }}
          MAX_PER_DAY: ${{ vars.MAX_PER_DAY }}
        run: |
          git config user.name "x2fb-bot"
          git config user.email "x2fb-bot@users.noreply.github.com"
          python -m x2fb loop --minutes 340 --sync
      - name: Relay to the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run x2fb.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
