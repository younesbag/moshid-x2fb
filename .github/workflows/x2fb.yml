name: x2fb

on:
  schedule:
    - cron: "2,32 * * * *"   # كل نصف ساعة: المواعيد تُختار على :00 و:30 فيُنشر بعدها بدقيقتين
  workflow_dispatch:

permissions:
  contents: write

# دورة واحدة في كل لحظة: طابع الادّعاء في السجل يفترض ألا تتسابق دورتان
concurrency:
  group: x2fb
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # رأس الفرع لحظة التنفيذ، لا الـSHA المثبّت لحظة الإطلاق — وإلا قرأت الدورة المنتظرة سجلاً قديماً
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cycle
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSFORMER: ${{ vars.TRANSFORMER }}
          MODE: ${{ vars.MODE }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          VETO_HOURS: ${{ vars.VETO_HOURS }}
          X_USERNAME: ${{ vars.X_USERNAME }}
          MAX_PER_DAY: ${{ vars.MAX_PER_DAY }}
        run: python -m x2fb run
      - name: Save ledger
        if: always()
        run: |
          git config user.name "x2fb-bot"
          git config user.email "x2fb-bot@users.noreply.github.com"
          [ -f state/ledger.json ] || exit 0
          git add state/ledger.json
          git diff --cached --quiet && exit 0
          git commit -m "state: cycle $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::تعذّر حفظ السجل — حارس الصفحة يمنع النشر المكرر في الدورة التالية"
          exit 1
